<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7f1"><title>RAF Coaching — Sign In</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;background:#f4f7f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;color:#17231d}main{width:min(420px,100%);background:#fff;border:1px solid #e0e8dc;border-radius:26px;padding:34px;box-sizing:border-box;box-shadow:0 20px 60px rgba(32,60,38,.1)}h1{margin:0 0 10px;font-size:38px;letter-spacing:-1.8px}p{color:#718078;line-height:1.5;margin:0 0 24px}input{display:block;width:100%;height:52px;box-sizing:border-box;margin:0 0 12px;padding:0 15px;border:1px solid #d8e3d5;border-radius:12px;background:#fbfdf9;font-size:16px}button{width:100%;min-height:50px;border-radius:12px;border:0;background:#a8e95b;color:#17301c;font-size:15px;font-weight:750;margin-top:8px}#msg{min-height:24px;margin-top:14px;font-size:13px;color:#b34e3c;line-height:1.5}a{display:block;text-align:center;margin-top:14px;color:#5d7c52;text-decoration:none;font-size:14px}</style></head><body><main><h1>RAF Coaching</h1><p>Sign in to continue to your coaching platform.</p><form id="form"><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="submit" type="submit">Sign In</button></form><div id="msg" role="status"></div><a href="index.html">Back to app</a></main><script>const URL='https://zkymvovbpfrwjyfwylbq.supabase.co',KEY='sb_publishable_9SgCU4D-48kgotUdi79gfQ_NaouEXbO';const s=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'raf-auth-v3'}});const f=document.getElementById('form'),b=document.getElementById('submit'),m=document.getElementById('msg');async function init(){const r=await s.auth.getSession();if(r.data?.session?.user)location.replace('index.html')}f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.textContent='Signing in…';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;try{const r=await s.auth.signInWithPassword({email,password});if(r.error){m.textContent=r.error.message;return}const session=r.data?.session;if(!session){m.textContent='No session was returned. Please try again.';return}await s.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});localStorage.setItem('rafSessionHandoff',JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token}));location.replace('index.html')}catch(x){m.textContent=x?.message||'Sign in failed. Please try again.'}finally{b.disabled=false}});init();</script></body></html>
